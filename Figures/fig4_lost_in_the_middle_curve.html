<div style="position: relative; width: 100%; height: 380px;">
<canvas id="lostMiddleChart" role="img" aria-label="Line chart showing LLM answer accuracy versus number of retrieved chunks. Accuracy rises from 72% at 1 chunk, peaks at 88% at 5 chunks, then falls to 58% at 20 chunks.">Accuracy peaks at 5 chunks (88%) then degrades.</canvas>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const ctx = document.getElementById('lostMiddleChart');
new Chart(ctx, {
  type: 'line',
  data: {
    labels: [1, 3, 5, 7, 10, 15, 20],
    datasets: [
      {
        label: 'Answer accuracy',
        data: [72, 85, 88, 83, 74, 65, 58],
        borderColor: '#534AB7',
        backgroundColor: '#534AB7',
        borderWidth: 2,
        tension: 0.35,
        pointRadius: 4,
        pointHoverRadius: 6,
        pointBackgroundColor: '#534AB7'
      },
      {
        label: 'Degradation zone',
        data: [null, null, null, 83, 74, 65, 58],
        borderColor: 'rgba(226,75,74,0)',
        backgroundColor: 'rgba(226,75,74,0.12)',
        fill: 'origin',
        pointRadius: 0,
        tension: 0.35
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    layout: { padding: { top: 20, right: 20, bottom: 10, left: 10 } },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: (c) => c.datasetIndex === 0 ? `Accuracy: ${c.parsed.y}%` : null,
          title: (items) => `${items[0].label} chunks`
        },
        filter: (item) => item.datasetIndex === 0
      },
      annotation: false
    },
    scales: {
      x: {
        title: { display: true, text: 'Number of retrieved chunks passed to LLM', color: '#5F5E5A', font: { size: 12 } },
        ticks: { color: '#5F5E5A', autoSkip: false },
        grid: { color: 'rgba(127,127,127,0.12)' }
      },
      y: {
        title: { display: true, text: 'Answer accuracy (%)', color: '#5F5E5A', font: { size: 12 } },
        min: 50,
        max: 100,
        ticks: { color: '#5F5E5A', stepSize: 10, callback: (v) => v + '%' },
        grid: { color: 'rgba(127,127,127,0.12)' }
      }
    }
  },
  plugins: [{
    id: 'optimalLine',
    afterDatasetsDraw(chart) {
      const { ctx, chartArea, scales } = chart;
      const x = scales.x.getPixelForValue(5);
      ctx.save();
      ctx.setLineDash([5, 4]);
      ctx.strokeStyle = '#3B6D11';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x, chartArea.top);
      ctx.lineTo(x, chartArea.bottom);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#3B6D11';
      ctx.font = '500 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Optimal range (3–5 chunks)', x, chartArea.top + 14);

      const xDeg = scales.x.getPixelForValue(12);
      const yDeg = scales.y.getPixelForValue(70);
      ctx.fillStyle = '#A32D2D';
      ctx.font = 'italic 12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('Performance degrades as', xDeg, yDeg);
      ctx.fillText('context grows', xDeg, yDeg + 16);
      ctx.restore();
    }
  }]
});
</script>
<p style="font-size: 12px; color: var(--color-text-secondary); margin: 12px 0 0; font-style: italic;">Adapted from Liu, N.F. et al. (2024). Lost in the Middle: How Language Models Use Long Contexts. TACL.</p>
